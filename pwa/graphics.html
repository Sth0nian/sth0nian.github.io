<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1013" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PWA Lab" />
    <meta name="description" content="WebGPU and WebGL 2 rendering and adapter information." />
    <title>Graphics · PWA Lab</title>
    <link rel="manifest" href="/pwa/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/pwa/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/pwa/icons/icon-180.png" />
    <link rel="stylesheet" href="/styled.css" />
    <link rel="stylesheet" href="/site-header.css" />
    <link rel="stylesheet" href="/pwa/pwa.css" />
  </head>
  <body class="lab">
    <header class="site-header">
      <div class="wrap">
        <a href="/pwa/" class="brand"><span class="brand-mark">~/</span>pwa-lab</a>
        <nav id="menu-placeholder" class="menubar" aria-label="Main"></nav>
      </div>
    </header>

    <main class="wrap">
      <a class="back" href="/pwa/">← All labs</a>
      <section class="page-intro">
        <p class="eyebrow">Lab 13</p>
        <h1 class="page-title">Graphics</h1>
        <p class="lede">The same spinning triangle drawn with WebGPU and with WebGL 2, plus what the GPU reports.</p>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 class="card-title"><span class="emoji">🎮</span> WebGPU</h2>
          <span id="gpuStatus"></span>
        </div>
        <canvas id="gpuCanvas" class="gfx" width="600" height="600"></canvas>
        <dl class="kv" id="gpuInfo" style="margin-top: 16px"></dl>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 class="card-title"><span class="emoji">🔺</span> WebGL 2</h2>
          <span id="glStatus"></span>
        </div>
        <canvas id="glCanvas" class="gfx" width="600" height="600"></canvas>
        <dl class="kv" id="glInfo" style="margin-top: 16px"></dl>
      </section>

      <section class="card">
        <h2 class="card-title"><span class="emoji">📜</span> Events</h2>
        <div class="log" id="log"></div>
      </section>
    </main>

    <footer id="footer-placeholder" class="site-footer"></footer>

    <script src="/js/components.js"></script>
    <script src="/pwa/lab.js"></script>
    <script src="/pwa/js/graphics.js"></script>
  </body>
</html>
