<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1013" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PWA Lab" />
    <meta name="description" content="DeviceOrientation, DeviceMotion, compass heading and Geolocation." />
    <title>Motion & location · PWA Lab</title>
    <link rel="manifest" href="/pwa/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/pwa/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/pwa/icons/icon-180.png" />
    <link rel="stylesheet" href="/styled.css" />
    <link rel="stylesheet" href="/site-header.css" />
    <link rel="stylesheet" href="/pwa/pwa.css" />
  </head>
  <body class="lab">
    <header class="site-header">
      <div class="wrap">
        <a href="/pwa/" class="brand"><span class="brand-mark">~/</span>pwa-lab</a>
        <nav id="menu-placeholder" class="menubar" aria-label="Main"></nav>
      </div>
    </header>

    <main class="wrap">
      <a class="back" href="/pwa/">← All labs</a>
      <section class="page-intro">
        <p class="eyebrow">Lab 05</p>
        <h1 class="page-title">Motion & location</h1>
        <p class="lede">Tilt, compass heading, acceleration and GPS, straight from the sensors.</p>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 class="card-title"><span class="emoji">🧭</span> Orientation &amp; motion</h2>
          <span id="motionStatus"></span>
        </div>
        <p class="muted small">iOS asks for permission before sharing motion data, and only after a tap.</p>
        <div class="button-row">
          <button type="button" class="button" id="enableMotion">Enable sensors</button>
        </div>
        <div class="instruments">
          <div class="instrument" id="level"><div class="level-ring"></div><div class="bubble" id="bubble"></div><span class="instrument-label">Spirit level</span></div>
          <div class="instrument" id="compass"><span class="compass-n">N</span><div class="needle" id="needle"></div><span class="instrument-label" id="headingLabel">Compass</span></div>
        </div>
        <dl class="kv" id="sensors"></dl>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 class="card-title"><span class="emoji">📍</span> Geolocation</h2>
          <span id="geoStatus"></span>
        </div>
        <label class="check"><input type="checkbox" id="highAccuracy" checked /> High accuracy (GPS)</label>
        <div class="button-row">
          <button type="button" class="button" id="locate">Where am I?</button>
          <button type="button" class="button secondary" id="watch">Start tracking</button>
        </div>
        <dl class="kv" id="geo" style="margin-top: 16px"></dl>
      </section>

      <section class="card">
        <h2 class="card-title"><span class="emoji">📜</span> Events</h2>
        <div class="log" id="log"></div>
      </section>
    </main>

    <footer id="footer-placeholder" class="site-footer"></footer>

    <script src="/js/components.js"></script>
    <script src="/pwa/lab.js"></script>
    <script src="/pwa/js/motion.js"></script>
  </body>
</html>
