<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1013" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PWA Lab" />
    <meta name="description" content="SpeechSynthesis voices and (webkit) SpeechRecognition." />
    <title>Speech · PWA Lab</title>
    <link rel="manifest" href="/pwa/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/pwa/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/pwa/icons/icon-180.png" />
    <link rel="stylesheet" href="/styled.css" />
    <link rel="stylesheet" href="/site-header.css" />
    <link rel="stylesheet" href="/pwa/pwa.css" />
  </head>
  <body class="lab">
    <header class="site-header">
      <div class="wrap">
        <a href="/pwa/" class="brand"><span class="brand-mark">~/</span>pwa-lab</a>
        <nav id="menu-placeholder" class="menubar" aria-label="Main"></nav>
      </div>
    </header>

    <main class="wrap">
      <a class="back" href="/pwa/">← All labs</a>
      <section class="page-intro">
        <p class="eyebrow">Lab 07</p>
        <h1 class="page-title">Speech</h1>
        <p class="lede">Make the phone talk with the system voices, and turn your voice into text.</p>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 class="card-title"><span class="emoji">🗣️</span> Text to speech</h2>
          <span id="ttsStatus"></span>
        </div>
        <label class="field">Text<textarea id="ttsText">Hello! I am a progressive web app, and I can talk.</textarea></label>
        <label class="field">Voice<select id="voice"></select></label>
        <div class="field-row">
          <label class="field">Rate <span id="rateValue">1</span><input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" /></label>
          <label class="field">Pitch <span id="pitchValue">1</span><input type="range" id="pitch" min="0" max="2" step="0.1" value="1" /></label>
        </div>
        <div class="button-row">
          <button type="button" class="button" id="speak">Speak</button>
          <button type="button" class="button secondary" id="pause">Pause</button>
          <button type="button" class="button secondary" id="resume">Resume</button>
          <button type="button" class="button secondary" id="cancel">Stop</button>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 class="card-title"><span class="emoji">🎙️</span> Speech to text</h2>
          <span id="sttStatus"></span>
        </div>
        <div class="field-row">
          <label class="field">Language
            <select id="sttLang">
              <option value="en-GB">English (UK)</option>
              <option value="en-US">English (US)</option>
              <option value="nl-NL">Nederlands</option>
            </select>
          </label>
        </div>
        <label class="check"><input type="checkbox" id="interim" checked /> Show words as they're heard</label>
        <div class="button-row">
          <button type="button" class="button" id="listen">Start listening</button>
          <button type="button" class="button secondary" id="stopListening" disabled>Stop</button>
        </div>
        <pre class="code" id="transcript">…</pre>
      </section>

      <section class="card">
        <h2 class="card-title"><span class="emoji">📜</span> Events</h2>
        <div class="log" id="log"></div>
      </section>
    </main>

    <footer id="footer-placeholder" class="site-footer"></footer>

    <script src="/js/components.js"></script>
    <script src="/pwa/lab.js"></script>
    <script src="/pwa/js/speech.js"></script>
  </body>
</html>
